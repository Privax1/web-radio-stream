<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <meta name="description" content="Listen together: a shared radio fed by everyone's queue." />
    <title>Web Radio</title>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1 id="station-name">Web Radio</h1>
        <div class="top-right">
          <button class="pill" id="host-btn" type="button" hidden>Host</button>
          <span class="pill" id="connection" data-state="connecting">connecting…</span>
        </div>
      </header>

      <section class="host-panel" id="host-panel" hidden aria-label="Host controls">
        <label class="switch">
          <input id="host-link" type="checkbox" />
          <span>My play/pause controls everyone</span>
        </label>
        <button class="link" id="host-logout" type="button">Log out</button>
      </section>

      <section class="now" aria-labelledby="now-title">
        <div class="cover" id="cover">
          <img id="cover-img" alt="" hidden />
        </div>
        <div class="now-text">
          <p class="eyebrow" id="now-eyebrow">Now playing</p>
          <h2 id="now-title">Nothing yet</h2>
          <p class="sub" id="now-sub">Add a song below to get the radio going.</p>
        </div>
        <div class="progress">
          <input id="seek" type="range" min="0" max="0" step="1" value="0" disabled
                 aria-label="Position (moves the stream for everyone)" />
          <div class="times">
            <span id="elapsed">0:00</span>
            <form id="jump-form" class="jump" hidden>
              <input id="jump" type="text" inputmode="numeric" placeholder="1:23"
                     pattern="[0-9:]+" aria-label="Jump to time (m:ss)" />
              <button type="submit">Go</button>
            </form>
            <span id="duration">0:00</span>
          </div>
        </div>
        <div class="controls">
          <button class="play" id="play" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z" /></svg>
            <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
          </button>
          <button class="ghost" id="skip" type="button" aria-label="Skip for everyone" disabled>
            <svg viewBox="0 0 24 24"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z" /></svg>
          </button>
        </div>
        <div class="volume">
          <button class="mute" id="mute" type="button" aria-label="Mute">
            <svg viewBox="0 0 24 24" class="icon-volume"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg viewBox="0 0 24 24" class="icon-muted"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.9-2.9-1.4-1.4-2.9 2.9-2.9-2.9-1.4 1.4 2.9 2.9-2.9 2.9 1.4 1.4 2.9-2.9 2.9 2.9 1.4-1.4z"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume (only for you)" />
        </div>
        <p class="sub center" id="listeners"></p>
      </section>

      <section class="add" aria-label="Add a song">
        <form id="add-form">
          <input id="url" name="url" type="url" inputmode="url" autocomplete="off" required
                 placeholder="YouTube or SoundCloud link (song or playlist)" />
          <button type="submit" id="add-btn">Add</button>
        </form>
        <label class="switch option" id="playlist-option" hidden>
          <input id="whole-playlist" type="checkbox" />
          <span>Add the whole playlist, not just this song</span>
        </label>
        <label class="name">
          <span>Your name</span>
          <input id="name" type="text" maxlength="32" autocomplete="nickname" placeholder="optional" />
        </label>
        <p class="message" id="message" role="status"></p>
      </section>

      <section class="queue" aria-labelledby="queue-title">
        <h3 id="queue-title">Up next <span id="queue-count"></span></h3>
        <ol id="queue-list"></ol>
        <p class="sub" id="queue-empty">The queue is empty.</p>
      </section>

      <details class="queue history" id="history">
        <summary><h3>Recently played <span id="history-count"></span></h3></summary>
        <ol id="history-list"></ol>
        <p class="sub" id="history-empty">Nothing has been played yet.</p>
      </details>

      <section class="settings" aria-label="Settings">
        <label class="switch">
          <input id="show-covers" type="checkbox" checked />
          <span>Load cover images</span>
        </label>
      </section>
    </main>

    <audio id="audio" preload="none"></audio>
    <script src="/app.js" type="module"></script>
  </body>
</html>

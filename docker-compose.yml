services:
  radio:
    build: .
    pull_policy: build
    image: web-radio-stream
    init: true
    restart: unless-stopped
    networks:
      proxy:
    environment:
      STATION_NAME: "Web Radio"
      # Shared password for the whole site (HTTP Basic auth, any username). Empty = open.
      APP_PASSWORD: ""
      # Host password: enables host login with station-wide pause/resume. Empty = no host.
      ADMIN_PASSWORD: ""
      # "true": only the host may skip, seek and remove songs.
      # HOST_ONLY_CONTROLS: "false"
      # BITRATE_KBPS: "128"
      # MAX_TRACK_SECONDS: "1800"
      # MAX_QUEUE_LENGTH: "100"
      # MAX_PLAYLIST_LENGTH: "50"   # most songs taken from one playlist link
      # HISTORY_LENGTH: "50"        # entries in "Recently played"
      # ALLOWED_DOMAINS: "youtube.com,youtu.be,soundcloud.com"   # "*" = anything yt-dlp supports
    volumes:
      - radio-cache:/data

volumes:
  radio-cache:
networks:
  proxy:
    external: true